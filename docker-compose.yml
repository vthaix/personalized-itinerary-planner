services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-planner}
      MYSQL_USER: ${MYSQL_USER:-planner}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-planner}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysqldata:/var/lib/mysql
      - ./infra/mysql/my.cnf:/etc/mysql/conf.d/planner.cnf:ro
      - ./infra/mysql/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  # OSRM cần dữ liệu đã xử lý trong data/osrm (xem README, bước "Dựng OSRM").
  # Chạy bằng: docker compose --profile routing up osrm
  osrm:
    profiles: ["routing"]
    image: osrm/osrm-backend:latest
    platform: linux/amd64
    command: osrm-routed --algorithm mld /data/vietnam.osrm
    volumes:
      - ./data/osrm:/data:ro
    ports:
      - "${OSRM_PORT:-5001}:5000"

volumes:
  mysqldata:
