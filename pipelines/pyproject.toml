[project]
name = "itinerary-pipelines"
version = "0.1.0"
description = "Các bước chuẩn bị dữ liệu: thu thập OSM, làm sạch, nạp MySQL. Mỗi bước gọi riêng được (Python hoặc CLI)."
requires-python = ">=3.11"
dependencies = ["PyMySQL>=1.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
itinerary-pipelines = "itinerary_pipelines.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["itinerary_pipelines*"]

[tool.setuptools.package-data]
"itinerary_pipelines.load" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
